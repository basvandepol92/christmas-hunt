<div class="panel">
  <div class="panel-header">
    <div>
      <p class="eyebrow">Voortgang</p>
      <h3>{{ foundCount }} / {{ totalLetters }} letters gevonden</h3>
      <p class="hint">Blijf verzamelen en leg de letters in de juiste volgorde voor het kerstwoord.</p>
    </div>
  </div>

  <div class="letters">
    <div
      class="letter-slot"
      *ngFor="let letter of letters; let i = index"
      [class.found]="!!letter"
      [attr.aria-label]="letter ? 'Letter gevonden' : 'Nog op slot'"
    >
      <ng-container *ngIf="letter; else locked">
        <img src="assets/gift.png" alt="Cadeautje gevonden" />
      </ng-container>
      <ng-template #locked>
        <span class="lock" aria-hidden="true">🔒</span>
      </ng-template>
      <small>#{{ i + 1 }}</small>
    </div>
  </div>
</div>
